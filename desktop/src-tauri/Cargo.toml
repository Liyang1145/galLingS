[package]
name = "gallings-desktop"
version = "0.1.0"
edition = "2021"
description = "galLingS 桌面程序：离线包（tools/build_desktop_dist.py）装进 Tauri 外壳，双击就玩"
license = "Apache-2.0"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
# 后台 Python 进程设 PR_SET_PDEATHSIG：外壳被强杀时后端跟着退出（Windows 由窗口销毁事件清理）
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
