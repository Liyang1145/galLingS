# 桌面程序：离线包（tools/build_desktop_dist.py）+ Tauri 外壳 → Windows 安装包和免安装 exe，Linux AppImage / deb / 免安装文件夹。
# 产物在 Actions → 本次运行 → Artifacts → gallings-desktop-windows、gallings-desktop-linux。
# 失败时把日志推到 ci-logs/desktop 分支（只放日志，方便没有 Actions 日志权限的协作 agent 排查）。
name: desktop
on:
  push:
    branches: [main, tanpowasd/dev, tanpowasd/linux]
    paths: ["core/**", "web/**", "desktop/**", "plugins/builtin/galagent/web/**", "海风与布丁/**", "content/cards/**", "compiler/**", "tools/build_desktop_dist.py", "tools/build_steam_release.py", "start.sh", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            desktop/src-tauri
      - name: 依赖
        run: python -m pip install -r requirements.txt 2>&1 | tee -a "$RUNNER_TEMP/ci.log"; exit ${PIPESTATUS[0]}
      - name: 引擎 → wasm
        working-directory: core
        run: cargo build --release --target wasm32-unknown-unknown 2>&1 | tee -a "$RUNNER_TEMP/ci.log"; exit ${PIPESTATUS[0]}
      - name: 离线包
        run: python tools/build_desktop_dist.py 2>&1 | tee -a "$RUNNER_TEMP/ci.log"; exit ${PIPESTATUS[0]}
      - name: Tauri 打包
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 build 2>&1 | tee -a "$RUNNER_TEMP/ci.log"; exit ${PIPESTATUS[0]}
      - name: 免安装版与 Steam Depot（exe + game 文件夹）
        run: |
          python tools/build_steam_release.py --skip-rust --out out/steam
          mkdir -p out/portable
          cp desktop/src-tauri/target/release/gallings-desktop.exe "out/portable/海风与布丁.exe"
          cp -r dist/desktop out/portable/game
          cp desktop/src-tauri/target/release/bundle/nsis/*.exe out/
      - uses: actions/upload-artifact@v5
        with:
          name: gallings-desktop-windows
          path: out/
      - name: 失败日志 → ci-logs/desktop
        if: failure()
        run: |
          d="$RUNNER_TEMP/logs"; rm -rf "$d"; mkdir -p "$d"; cd "$d"
          git init -q; git checkout -q -b ci-logs/desktop
          tail -c 200000 "$RUNNER_TEMP/ci.log" > desktop.log 2>/dev/null || echo "（没有日志：失败发生在第一步之前）" > desktop.log
          echo "run ${{ github.run_id }} sha ${{ github.sha }}" > run.txt
          git add . && git -c user.name=ci -c user.email=ci@localhost commit -q -m "desktop CI 失败日志 ${{ github.run_id }}"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs/desktop

  linux:
    # 22.04 的 glibc 较老，编出来的程序在更新的发行版和 SteamOS 3 上都能跑
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            desktop/src-tauri
      - name: 系统依赖（WebKitGTK 4.1、AppImage 工具）
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf file \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - name: 依赖
        run: python -m pip install -r requirements.txt 2>&1 | tee -a "$RUNNER_TEMP/ci.log"; exit ${PIPESTATUS[0]}
      - name: 引擎 → wasm
        working-directory: core
        run: cargo build --release --target wasm32-unknown-unknown 2>&1 | tee -a "$RUNNER_TEMP/ci.log"; exit ${PIPESTATUS[0]}
      - name: 离线包
        run: python tools/build_desktop_dist.py 2>&1 | tee -a "$RUNNER_TEMP/ci.log"; exit ${PIPESTATUS[0]}
      - name: Tauri 打包（AppImage + deb）
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 build --bundles appimage,deb 2>&1 | tee -a "$RUNNER_TEMP/ci.log"; exit ${PIPESTATUS[0]}
      - name: 免安装版与 Steam Depot（Linux）
        run: |
          python tools/build_steam_release.py --skip-rust --platform linux --out out/steam
          mkdir -p out/portable
          cp desktop/src-tauri/target/release/gallings-desktop "out/portable/海风与布丁"
          chmod +x "out/portable/海风与布丁"
          cp -r dist/desktop out/portable/game
          cp desktop/src-tauri/target/release/bundle/appimage/*.AppImage out/
          cp desktop/src-tauri/target/release/bundle/deb/*.deb out/
          tar -C out -czf out/haifeng-pudding-linux-portable.tar.gz portable
      - uses: actions/upload-artifact@v5
        with:
          name: gallings-desktop-linux
          path: |
            out/*.AppImage
            out/*.deb
            out/haifeng-pudding-linux-portable.tar.gz
            out/steam/
      - name: 失败日志 → ci-logs/desktop-linux
        if: failure()
        run: |
          d="$RUNNER_TEMP/logs"; rm -rf "$d"; mkdir -p "$d"; cd "$d"
          git init -q; git checkout -q -b ci-logs/desktop-linux
          tail -c 200000 "$RUNNER_TEMP/ci.log" > desktop.log 2>/dev/null || echo "（没有日志：失败发生在第一步之前）" > desktop.log
          echo "run ${{ github.run_id }} sha ${{ github.sha }}" > run.txt
          git add . && git -c user.name=ci -c user.email=ci@localhost commit -q -m "desktop-linux CI 失败日志 ${{ github.run_id }}"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs/desktop-linux
