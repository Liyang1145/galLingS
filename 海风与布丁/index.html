<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#000000">
<title>VN Studio</title>
<style id="assetCss"></style>
<style>
:root{--bg:#121318;--panel:#1b1d24;--line:#2a2d38;--fg:#e8e8ee;--dim:#8b8fa3;--acc:#7aa2ff;--ghost:.35}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden;user-select:none}
#app{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:44px 1fr var(--tlh,260px);height:100%}
#top{grid-column:1/3;min-width:0;display:flex;align-items:center;gap:2px;padding:0 8px;background:var(--panel);border-bottom:1px solid var(--line)}
.btn{width:32px;height:32px;border:0;border-radius:6px;background:transparent;color:var(--fg);font-size:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none}
.svi{width:1.2em;height:1.2em;flex:none;vertical-align:-.22em;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;shape-rendering:geometricPrecision;pointer-events:none}
.btn .svi{width:1.15em;height:1.15em}
.tclip .ic .svi,.card .ic .svi{width:1.25em;height:1.25em;vertical-align:-.25em}
#tlScroll .mk .svi{width:1.1em;height:1.1em;margin-right:2px}
.thead .nmx .svi{width:16px;height:16px}
.btn:hover{background:#2a2d38}.btn.on{background:#2b3655;color:var(--acc)}.btn:disabled{opacity:.3;cursor:default}
.sep{width:1px;height:22px;background:var(--line);margin:0 6px}
.grow{flex:1}
/* 侧边栏 */
#side{grid-row:2/4;width:224px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;transition:width .15s}
#side.collapsed{width:40px}
#side.collapsed .sec{display:none}
#sideHead{display:flex;justify-content:flex-end;padding:4px}
#side.collapsed #sideHead{justify-content:center}
.sec{display:flex;flex-direction:column;min-height:0;border-top:1px solid var(--line)}
.sec.open{flex:1}
.secHead{display:flex;align-items:center;padding:2px 4px;gap:2px}
.secHead .ico{font-size:16px;padding:0 6px}
.grid{display:none;overflow-y:auto;padding:6px;gap:6px;align-content:start;flex:1}
.sec.open .grid{display:grid}
.sec.drop{outline:2px dashed var(--acc);outline-offset:-4px}
#gbg{grid-template-columns:1fr 1fr}
#gch{grid-template-columns:1fr 1fr 1fr}
.th{position:relative;border-radius:6px;background:#0d0e12 center/cover no-repeat;cursor:grab;border:1px solid var(--line)}
#gbg .th{aspect-ratio:16/9}
#gch .th{aspect-ratio:3/5;background-size:contain;background-position:center bottom}
.th:hover{border-color:var(--acc)}
.th .x{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;border:0;background:#3a3e4c;color:#fff;font-size:11px;cursor:pointer;display:none;line-height:18px;padding:0}
.th:hover .x{display:block}
/* 舞台 */
#main{position:relative;overflow:hidden;background:#0b0c0f}
#stage{position:absolute;width:1280px;height:720px;transform-origin:0 0;background:#000;overflow:hidden;overflow:clip;box-shadow:0 0 0 1px var(--line)}
#bgEl{position:absolute;inset:0;background:#1a1b20 center/cover no-repeat}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:120px;color:#ffffff10;pointer-events:none}
#layer{position:absolute;inset:0;z-index:0}   /* 自成层叠上下文：立绘的 z-index（0,1,2…）不会盖过氛围层 / 对话框 */
.spr{position:absolute;cursor:move;transform-origin:50% 100%}
.spr{filter:var(--scene-light,) var(--lk,)}
.spr.sel{filter:var(--scene-light,) var(--lk,) drop-shadow(0 0 2px var(--acc)) drop-shadow(0 0 1px var(--acc))}
#guide{position:absolute;top:0;bottom:0;left:640px;width:1px;background:var(--acc);display:none;pointer-events:none}
#sprBar{position:absolute;display:none;gap:2px;background:#1b1d24ee;border-radius:8px;padding:3px;transform:translate(-50%,-100%);z-index:5}
#sprBar .btn{width:30px;height:30px;font-size:14px}
/* 对话框 */
#stage{--dBg:linear-gradient(#0c0f1ad0,#0c0f1af0);--dBorder:1px solid #ffffff22;--dRad:14px;--dSide:60px;--dBot:28px;--dH:190px;--dShadow:none;--nBg:#2b3655;--nFg:#fff;--nRad:10px;--nBorder:1px solid #ffffff30;--tFg:#fff;--tSize:26px;--font:inherit;--cBg:#0c0f1ad8;--cHover:#2b3655;--cBorder:1px solid #ffffff40;--cRad:12px}
#dlg,#pdlg{position:absolute;left:var(--dSide);right:var(--dSide);bottom:var(--dBot);height:var(--dH);border-radius:var(--dRad);background:var(--dBg);border:var(--dBorder);box-shadow:var(--dShadow);padding:46px 36px 20px;z-index:4;font-family:var(--font)}
#dlg,#pdlg{opacity:var(--ghost);transition:opacity .15s}
#dlg:hover,#dlg:focus-within,#stage[data-dlg=show] #dlg,#stage[data-dlg=show] #pdlg{opacity:1}
#stage[data-dlg=hidden] #dlg{display:none}
#nm,#pnm{position:absolute;top:-20px;left:28px;min-width:140px;height:40px;padding:0 18px;border-radius:var(--nRad);background:var(--nBg);border:var(--nBorder);color:var(--nFg);font-family:var(--font);font-weight:600;font-size:22px;line-height:40px}
#nm{outline:none;width:180px}
#tx,#ptx{width:100%;height:100%;background:transparent;border:0;outline:none;resize:none;color:var(--tFg);font-family:var(--font);font-size:var(--tSize);line-height:1.6}
#pdlg{display:none;cursor:pointer}
#pnm:empty{display:none}
/* 播放模式 */
body.playing #main{position:fixed;inset:0;z-index:50;background:#000}
body.playing #dlg,body.playing #sprBar,body.playing #guide{display:none!important}
body.playing #pdlg{display:block}
body.playing .spr{cursor:pointer}
#bgEl,#layer{animation:var(--moodAnim,none)}
#stage.fade #bgEl,#stage.fade #layer{animation:fade .45s,var(--moodAnim,none)}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* 时间轴 */
#tl{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--panel);border-top:1px solid var(--line);overflow-x:auto;overflow-y:hidden}
.card{position:relative;flex:none;width:132px;height:70px;border-radius:8px;background:#23262f;border:1px solid var(--line);padding:6px 8px;font-size:12px;cursor:pointer;overflow:hidden}
.card.shot{margin-left:14px;border-left:4px solid var(--acc)}
.card.shot:first-child{margin-left:0}
.card.cur{border-color:var(--acc);background:#2b3655}
.card .n{color:var(--dim);font-size:11px}
.card .sp{font-weight:600}
.card .t{color:#c9cbd6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .bgt{position:absolute;right:0;top:0;width:44px;height:25px;background:center/cover;opacity:.7;border-bottom-left-radius:6px}
.card .x{position:absolute;right:2px;bottom:2px;border:0;background:none;color:var(--dim);cursor:pointer;display:none}
.card:hover .x{display:block}
.card .ic{position:absolute;left:8px;bottom:3px;font-size:10px;color:var(--acc);white-space:nowrap;overflow:hidden;max-width:110px}
#gau{grid-template-columns:1fr}
.au{position:relative;display:flex;align-items:center;gap:6px;height:30px;padding:0 8px;border-radius:6px;background:#0d0e12;border:1px solid var(--line);cursor:grab;font-size:12px}
.au:hover{border-color:var(--acc)}
.au .nmx{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#c9cbd6}
.au .pv{border:0;background:none;color:var(--fg);cursor:pointer;padding:0;font-size:12px}
.au .x{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;border:0;background:#3a3e4c;color:#fff;font-size:11px;cursor:pointer;display:none;padding:0}
.au:hover .x{display:block}
#props{position:absolute;right:12px;top:12px;width:270px;max-height:calc(100% - 24px);overflow-y:auto;background:#1b1d24f2;border:1px solid var(--line);border-radius:10px;padding:10px;z-index:20;display:none;font-size:12px}
#props.open{display:block}
body.playing #props{display:none}
#props .r{display:flex;align-items:center;gap:6px;margin:6px 0}
#props .r>i{width:22px;font-style:normal;text-align:center;font-size:14px}
#props input,#props select{flex:1;min-width:0;background:#0d0e12;color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:4px 6px;font:inherit}
#props .seg{display:flex;flex:1}
#props .seg button{flex:1;border:1px solid var(--line);background:#23262f;color:var(--fg);padding:4px 0;cursor:pointer;font-size:14px}
#props .seg button.on{background:#2b3655;border-color:var(--acc)}
#props .mini{border:0;background:none;color:var(--dim);cursor:pointer;font-size:13px}
#props hr{border:0;border-top:1px solid var(--line);margin:8px 0}
#choices{position:absolute;left:0;right:0;top:120px;display:none;flex-direction:column;align-items:center;gap:14px;z-index:6}
#choices.show{display:flex}
#choices button{min-width:520px;padding:14px 30px;border-radius:var(--cRad);border:var(--cBorder);background:var(--cBg);color:var(--tFg);font:inherit;font-family:var(--font);font-size:24px;cursor:pointer;box-shadow:var(--dShadow)}
#choices button:hover{background:var(--cHover);color:var(--nFg)}
#choices.edit{opacity:.55;pointer-events:none}
#choices .ctimer{width:520px;max-width:80%;height:4px;margin-top:6px;border-radius:2px;background:#ffffff26;display:flex;justify-content:center;overflow:hidden;box-shadow:0 0 8px #0006}
#choices .ctimer i{display:block;width:100%;height:100%;border-radius:2px;background:linear-gradient(90deg,#7fd8ff,#fff,#7fd8ff)}
#veil{position:absolute;inset:0;z-index:7;pointer-events:none;opacity:0}
#veil.go{animation:veil .8s ease-out}
@keyframes veil{from{opacity:1}to{opacity:0}}

.card.chapter{margin-left:24px}
.card .chap{position:absolute;left:0;right:0;top:0;height:3px;background:#e6b450}
#chSel{background:#0d0e12;color:var(--fg);border:1px solid var(--line);border-radius:6px;height:28px;max-width:170px;margin:0 6px}
#saveWarn{color:#ff8a65;display:none}
#folderMenu .opt{display:flex;flex-direction:column;gap:10px;min-width:380px}
#folderMenu button{padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:#0d0e12;color:var(--fg);text-align:left;cursor:pointer;font-size:14px}
#folderMenu button:hover{border-color:var(--acc)}
#folderMenu small{color:var(--dim)}
#stage.shake #bgEl,#stage.shake #layer{animation:shake .5s,var(--moodAnim,none)}
/* —— 瞬时特效（只在这一节出现时播一次） —— */
#stage.quake #bgEl,#stage.quake #layer{animation:quake .9s cubic-bezier(.3,.7,.4,1),var(--moodAnim,none)}
@keyframes quake{0%{transform:translate(0,0) scale(1.06)}8%{transform:translate(-34px,18px) scale(1.06)}16%{transform:translate(30px,-22px) scale(1.05)}26%{transform:translate(-24px,14px) scale(1.04)}38%{transform:translate(18px,-10px) scale(1.03)}52%{transform:translate(-10px,6px) scale(1.02)}70%{transform:translate(5px,-3px) scale(1.01)}100%{transform:translate(0,0) scale(1)}}
#stage.zoom #bgEl,#stage.zoom #layer{animation:zoomHit .5s ease-out,var(--moodAnim,none)}
@keyframes zoomHit{0%{transform:scale(1)}25%{transform:scale(1.12)}100%{transform:scale(1)}}
/* 横甩（2026-10-19 开场演出）：白闪 + 镜头横向猛甩带动态模糊，不是原地震 */
#stage.whip #bgEl,#stage.whip #layer{animation:whipPan .62s cubic-bezier(.15,.85,.3,1),var(--moodAnim,none)}
@keyframes whipPan{0%{transform:translateX(0) scale(1.08);filter:blur(0)}14%{transform:translateX(-11%) scale(1.08);filter:blur(18px)}34%{transform:translateX(6%) scale(1.07);filter:blur(9px)}58%{transform:translateX(-2%) scale(1.04);filter:blur(3px)}100%{transform:translateX(0) scale(1);filter:blur(0)}}
#veil.blink{animation:blinkEye 1.6s ease-in-out}
@keyframes blinkEye{0%{opacity:1}25%{opacity:.15}40%{opacity:1}65%{opacity:0}78%{opacity:.6}100%{opacity:0}}
/* —— 持续氛围（跨多节，在时间轴“🌫 氛围轨”上拖长） —— */
#moodFx{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .6s}
#stage[data-mood]:not([data-mood=""]) #moodFx{opacity:1}
#stage[data-mood=dizzy]{--moodAnim:sway 7s ease-in-out infinite,blurPulse 5.3s ease-in-out infinite}
/* dizzy（v0.18.2）：暗角静止；忽明忽暗 = 一层纯黑只动 opacity；模糊 = 背景层/立绘层自己的 filter 动画（和 sway 一起走 --moodAnim）。
   原来是在整屏遮罩上逐帧改 background-color + backdrop-filter，每帧都要重画 / 回读整屏 */
#moodFx::after{content:'';position:absolute;inset:0;opacity:0;pointer-events:none}
#stage[data-mood=dizzy] #moodFx{background:radial-gradient(ellipse at center,#0000 25%,#000c 100%)}
#stage[data-mood=dizzy] #moodFx::after{background:#000;animation:dimPulse 4.2s ease-in-out infinite}
#stage[data-mood=flicker] #moodFx{background:#000;animation:flickerDim 3.6s linear infinite}
#stage[data-mood=strobe] #moodFx{background:#000;animation:strobe 1.1s steps(1) infinite}
#stage[data-mood=blur] #moodFx{backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#stage[data-mood=sway]{--moodAnim:sway 6s ease-in-out infinite}
#stage[data-mood=gray] #moodFx{background:radial-gradient(ellipse at center,#0000 45%,#000a 100%)}
#bgEl,#layer{transition:filter .6s}
#stage[data-mood=gray] #bgEl,#stage[data-mood=gray] #layer{filter:grayscale(1) contrast(.9)}
#stage[data-mood=dark] #moodFx{background:radial-gradient(ellipse at center,#0004 20%,#000e 95%)}
#stage[data-mood=danger] #moodFx{background:radial-gradient(ellipse at center,#0000 35%,#b0000088 100%);animation:heart 1.2s ease-in-out infinite}
/* 水下（2026-10-19）：蓝色滤镜 + 上浮气泡 + 画面轻漂；声音变闷由播放器按氛围压低配乐/环境音 */
#stage[data-mood=underwater]{--moodAnim:uwDrift 5.5s ease-in-out infinite}
#stage[data-mood=underwater] #bgEl,#stage[data-mood=underwater] #layer{filter:saturate(.8) brightness(.82) hue-rotate(-10deg) blur(1.4px)}
#stage[data-mood=underwater] #moodFx{background:linear-gradient(180deg,#2a8fd066 0%,#0b4f8f99 55%,#06305fcc 100%)}
#stage[data-mood=underwater] #moodFx::after{opacity:.9;background-image:radial-gradient(circle at 50% 50%,#ffffffcc 0 2px,#ffffff33 3px,#0000 5px),radial-gradient(circle at 50% 50%,#ffffffaa 0 4px,#ffffff22 6px,#0000 8px),radial-gradient(circle at 50% 50%,#ffffff99 0 1.5px,#0000 3px),radial-gradient(circle at 50% 50%,#ffffffbb 0 6px,#ffffff22 8px,#0000 11px);background-size:170px 230px,310px 410px,90px 150px,520px 640px;background-position:20px 0,140px 60px,60px 30px,300px 200px;animation:uwBubbles 4.5s linear infinite}
@keyframes uwBubbles{from{background-position:20px 0,140px 60px,60px 30px,300px 200px}to{background-position:34px -230px,128px -350px,66px -120px,310px -440px}}
@keyframes uwDrift{0%,100%{translate:0 0;scale:1.05}50%{translate:-14px 8px;scale:1.07}}
/* 慢动作（2026-10-19）：画面缓慢推近、褪色、暗角，环境声压低（定格感） */
#stage[data-mood=slowmo]{--moodAnim:slowPush 9s cubic-bezier(.2,.6,.3,1) forwards}
#stage[data-mood=slowmo] #bgEl,#stage[data-mood=slowmo] #layer{filter:saturate(.55) contrast(1.08) brightness(.95)}
#stage[data-mood=slowmo] #moodFx{background:radial-gradient(ellipse at center,#0000 40%,#0b1a2acc 100%)}
@keyframes slowPush{from{scale:1}to{scale:1.08}}
@keyframes dimPulse{0%,100%{opacity:0}18%{opacity:.667}30%{opacity:.2}46%{opacity:.867}55%{opacity:.133}72%{opacity:.533}}
@keyframes blurPulse{0%,100%{filter:blur(0)}40%{filter:blur(3px)}70%{filter:blur(1px)}}
@keyframes flickerDim{0%,100%{opacity:0}10%{opacity:.55}14%{opacity:.1}30%{opacity:.7}36%{opacity:.25}55%{opacity:.6}60%{opacity:.05}80%{opacity:.45}}
@keyframes strobe{0%{opacity:0}12%{opacity:.85}20%{opacity:0}48%{opacity:.85}52%{opacity:0}64%{opacity:.6}70%{opacity:0}}
@keyframes sway{0%,100%{rotate:0deg;scale:1.04;translate:0 0}25%{rotate:.7deg;translate:10px 4px}50%{rotate:-.5deg;scale:1.06;translate:-8px -3px}75%{rotate:.4deg;translate:6px 6px}}
@keyframes heart{0%,100%{opacity:.55}15%{opacity:1}30%{opacity:.6}45%{opacity:.95}}
/* 没有文字的“演出节”：对话框淡出，有台词时再淡入（菜单按钮保留） */
#pdlg{transition:background .4s,border-color .4s}
#pnm,#ptx{transition:opacity .4s}
#stage.nodlg #pdlg{background:transparent;border-color:transparent}
#stage.nodlg #pnm,#stage.nodlg #ptx{opacity:0}
#props select.fxsel{flex:1}
/* —— 立绘动画 —— */
#layer .spr.anim{transition:left .5s ease,top .5s ease,height .5s ease,filter .9s ease}
#layer .spr{transition:filter .9s ease}
#layer .spr.dim{filter:var(--scene-light,) var(--lk,) brightness(.62) saturate(.85)}
#lookPop{position:absolute;display:none;flex-wrap:wrap;gap:6px;padding:8px;background:#1b1d24f2;border:1px solid var(--line);border-radius:10px;z-index:8;transform:translate(-50%,0);width:400px}
#lookPop div b{position:absolute;inset:4px 4px 14px;background:center bottom/contain no-repeat}
#lookPop div{width:64px;height:96px;background:#4a5060;border-radius:6px;border:1px solid var(--line);cursor:pointer;position:relative}
#lookPop div i{position:absolute;left:0;right:0;bottom:0;font-style:normal;font-size:11px;text-align:center;background:#000a;color:#ddd;border-radius:0 0 6px 6px}
#lookPop div.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
#lookPop .sp{width:100%;height:auto;background:none;border:0;cursor:default;font-size:12px;color:var(--dim);display:flex;gap:6px;align-items:center}
#lookPop .sp button{border:1px solid var(--line);background:#0d0e12;color:var(--fg);border-radius:6px;padding:2px 8px;cursor:pointer;font-size:12px}
#lookPop .sp button.on{border-color:var(--acc);color:var(--acc)}
.spr.in-fade{animation:sIn .45s ease-out}
.spr.in-left{animation:sInL .55s cubic-bezier(.2,.8,.3,1)}
.spr.in-right{animation:sInR .55s cubic-bezier(.2,.8,.3,1)}
.spr.in-up{animation:sInU .55s cubic-bezier(.2,.8,.3,1)}
.spr.in-pop{animation:sPop .4s cubic-bezier(.3,1.6,.5,1)}
.spr.out-fade{animation:sIn .4s ease-in reverse forwards}
.spr.out-left{animation:sInL .5s ease-in reverse forwards}
.spr.out-right{animation:sInR .5s ease-in reverse forwards}
.spr.out-down{animation:sInU .5s ease-in reverse forwards}
.spr.act-jump{animation:aJump .5s ease-out}
.spr.act-shake{animation:aShake .5s linear}
.spr.act-nod{animation:aNod .6s ease-in-out}
.spr.act-lean{animation:aLean .55s ease-in-out}
.spr.act-flinch{animation:aFlinch .38s ease-out}
.spr.act-settle{animation:aSettle .55s ease-out}
@keyframes sIn{from{opacity:0}to{opacity:1}}
@keyframes sInL{from{opacity:0;translate:-280px 0}to{opacity:1;translate:0 0}}
@keyframes sInR{from{opacity:0;translate:280px 0}to{opacity:1;translate:0 0}}
@keyframes sInU{from{opacity:0;translate:0 140px}to{opacity:1;translate:0 0}}
@keyframes sPop{from{opacity:0;translate:0 40px}to{opacity:1;translate:0 0}}
@keyframes aJump{0%,100%{translate:0 0}30%{translate:0 -42px}55%{translate:0 0}75%{translate:0 -12px}}
@keyframes aShake{0%,100%{translate:0 0}15%{translate:-12px 0}30%{translate:10px 0}45%{translate:-8px 0}60%{translate:6px 0}80%{translate:-3px 0}}
@keyframes aNod{0%,100%{translate:0 0}35%{translate:0 22px}60%{translate:0 0}80%{translate:0 10px}}
@keyframes aLean{0%,100%{translate:0 0;rotate:0deg}45%{translate:-10px 0;rotate:-1.2deg}}
@keyframes aFlinch{0%,100%{translate:0 0}25%{translate:14px 1px}55%{translate:8px 0}}
@keyframes aSettle{0%{translate:0 -16px}65%{translate:0 3px}100%{translate:0 0}}
#animPop{position:absolute;display:none;flex-direction:column;gap:4px;padding:8px;background:#1b1d24f2;border:1px solid var(--line);border-radius:10px;z-index:8;transform:translate(-50%,0)}
#animPop .row{display:flex;gap:3px;align-items:center}
#animPop .row>i{width:22px;font-style:normal;color:var(--dim);font-size:13px}

#soul .win .btn{width:44px;height:40px;border-radius:8px;background:#6b4a3a;color:#fff6e6;font-size:18px;opacity:1}
#soul .win .btn:disabled,#soul .win input:disabled{opacity:.45}
#soul .left .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#aaa;margin-right:4px;vertical-align:middle}#soul .left .dot.ok{background:#4caf74}#soul .left .dot.bad{background:#e2725b}
#soul .left{font-size:13px;color:#a2856c;text-align:right;padding-top:4px;font-family:var(--font)}
#soul .ovx{position:absolute;top:12px;right:12px;margin:0;float:none;width:36px;height:36px;font-size:18px;background:transparent;border:1px solid #d9c7a6;color:#8a6b55}
#psettings .row.sep{margin-top:10px;padding-top:16px;border-top:1px solid #ffffff25}
#psettings .row .dim{color:#999;font-size:15px;white-space:nowrap}
#psettings .row.sep>span{width:auto;white-space:nowrap;color:#e8d3b8}
#psettings .seg{display:flex;gap:6px;flex-wrap:wrap}
#psettings .row.hid{display:none}
#psettings #soulUrl{flex:1;height:34px;border-radius:8px;border:1px solid #ffffff40;background:#ffffff10;color:#fff;padding:0 10px;font-size:15px}

/* —— 插件管理面板（v0.20）：编辑器弹窗和游戏浮层共用，颜色跟随各自的界面 —— */
.plgui{--pl-card:#ffffff06;--pl-line:var(--line);--pl-dim:var(--dim);--pl-fs:13px;display:flex;flex-direction:column;gap:12px;font-size:var(--pl-fs)}
#modal .plgui{width:min(700px,86vw)}
.plg-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.plg-head h2{margin:0;display:flex;align-items:center;gap:8px;font-size:1.25em;font-weight:600}
.plg-sub{color:var(--pl-dim);font-size:.92em}
.plg-head .grow{flex:1}
.plg-imp{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:6px;padding:7px 14px;cursor:pointer;background:var(--acc);color:#0b0c0f;font:inherit;font-weight:600}
.plg-list{display:flex;flex-direction:column;gap:8px;max-height:58vh;overflow-y:auto}
.plg-card{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--pl-line);border-radius:10px;background:var(--pl-card);transition:opacity .2s,border-color .2s}
.plg-card.off{opacity:.55}
.plg-card.bad{border-color:#ff8a8a77}
.plg-ic{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;background:#2b3655;color:var(--acc);flex:none;font-size:18px}
.plg-main{flex:1;min-width:0}
.plg-t{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.plg-t b{font-size:1.08em}
.plg-t small{color:var(--pl-dim)}
.plg-tag{font-size:.78em;padding:1px 8px;border-radius:999px;border:1px solid var(--acc);color:var(--acc);white-space:nowrap}
.plg-tag.dim{border-color:var(--pl-line);color:var(--pl-dim)}
.plg-d{color:var(--pl-dim);margin-top:3px;line-height:1.55}
.plg-perm{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.plg-perm span{font-size:.78em;padding:1px 7px;border-radius:4px;background:#ffffff12;color:var(--pl-dim)}
.plg-err{color:#ff8a8a;margin-top:6px;line-height:1.5}
.plg-set{display:none;flex-direction:column;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--pl-line)}
.plg-card.open .plg-set{display:flex}
.plg-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.plg-row>span{width:96px;color:var(--pl-dim);flex:none}
.plg-row input,.plg-row select,.plg-row textarea{flex:1;min-width:0}
.plg-row textarea{height:60px;resize:vertical;font:inherit}
.plg-row small{width:100%;padding-left:106px;color:var(--pl-dim);font-size:.85em}
.plg-ops{display:flex;align-items:center;gap:6px;flex:none}
.plg-b{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border:1px solid var(--pl-line);border-radius:6px;background:transparent;color:inherit;cursor:pointer;font:inherit;white-space:nowrap}
.plg-b.ico{width:30px;padding:0;justify-content:center}
.plg-b:hover:not(:disabled){border-color:var(--acc);color:var(--acc)}
.plg-b.del:hover{border-color:#ff8a8a;color:#ff8a8a}
.plg-b:disabled{opacity:.4;cursor:default}
.plg-sw{width:38px;height:22px;border-radius:999px;border:1px solid var(--pl-line);background:#ffffff14;position:relative;cursor:pointer;padding:0;flex:none;transition:background .2s,border-color .2s}
.plg-sw i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.plg-sw.on{background:var(--acc);border-color:var(--acc)}
.plg-sw.on i{transform:translateX(16px);background:#0b0c0f}
.plg-empty{text-align:center;padding:30px 0;color:var(--pl-dim);display:flex;flex-direction:column;align-items:center;gap:6px}
.plg-empty .svi{width:34px;height:34px;opacity:.6}
.plg-foot{color:var(--pl-dim);font-size:.85em;text-align:center}
.plgui.drag{outline:2px dashed var(--acc);outline-offset:6px;border-radius:10px}
/* 游戏里：和“设置”同一种浮层，字大一点 */
#plugins .plgui{--pl-card:#ffffff10;--pl-line:#ffffff30;--pl-dim:#c3c8d6;--pl-fs:18px;max-width:900px;margin:0 auto}
#plugins .plg-list{max-height:none;overflow:visible}
#plugins .plg-ic{width:50px;height:50px;font-size:24px;border-radius:12px;background:#ffffff14}
#plugins .plg-card{padding:16px;border-radius:12px}
#plugins .plg-b{height:40px;padding:0 14px;border-radius:8px}
#plugins .plg-b.ico{width:40px;padding:0}
#plugins .plg-sw{width:50px;height:28px}
#plugins .plg-sw i{width:22px;height:22px}
#plugins .plg-sw.on i{transform:translateX(22px)}
#plugins .plg-imp{border-radius:8px;padding:9px 20px}
#plugins .plg-row>span{width:130px}
#plugins .plg-row small{padding-left:140px}
#plugins .plg-row input,#plugins .plg-row select,#plugins .plg-row textarea{background:#ffffff10;border:1px solid #ffffff40;border-radius:8px;color:#fff;padding:7px 12px;font:inherit;font-size:17px;outline:none}
#plugins .plg-row select option{color:#000}
#plugins .plg-row input:focus,#plugins .plg-row select:focus{border-color:var(--acc)}
#plgToast{position:absolute;left:50%;top:28px;transform:translate(-50%,-10px);z-index:60;opacity:0;pointer-events:none;background:#000c;color:#fff;border:1px solid #ffffff30;border-radius:10px;padding:8px 18px;font-size:18px;transition:opacity .25s,transform .25s;font-family:var(--font)}
#plgToast.show{opacity:1;transform:translate(-50%,0)}
#endcard button.pb{background:var(--acc);color:#000;border-color:transparent;font-weight:600}
#title.glass button:nth-child(5){animation-delay:.83s}#title.glass button:nth-child(6){animation-delay:.95s}#title.glass button:nth-child(7){animation-delay:1.07s}
/* 玩家操作统一叠化；只改变视觉，不延迟剧情、变量或存档。 */
body.playing #stage button{transition:background-color .18s ease,color .18s ease,border-color .18s ease,box-shadow .18s ease,opacity .18s ease,transform .25s ease}
body.playing #choices.show{animation:vnChoiceIn .28s ease-out both}
@keyframes vnChoiceIn{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){body.playing #choices.show{animation:none}body.playing #stage button{transition:none}}

body.game #title .menu button:nth-child(4){left:-54px}
body.game #title .menu button:hover{background:var(--whale-menu) center/100% 100% no-repeat;box-shadow:none;transform:none;filter:brightness(1.16)}
body.game #title .menu button:active{filter:brightness(.95);translate:0 1px}
body.game #title .menu button:focus-visible{outline:1px solid #def1ff88;outline-offset:5px}
/* Choices retain the approved D corner frame and their actual story text/callbacks. */
body.game #choices{gap:26px}
body.game #choices>button{box-sizing:border-box;width:520px;min-width:520px;max-width:1040px;min-height:76px;padding:17px 74px;border:0;border-radius:0;background:var(--whale-choice) center/100% 100% no-repeat;color:#f0f8ff;box-shadow:none;font-size:25px;font-weight:400;line-height:1.6;text-align:center;overflow-wrap:anywhere;text-shadow:0 1px 3px #15354e88;transition:filter .2s ease,translate .2s ease}
body.game #choices>button:hover{background:var(--whale-choice) center/100% 100% no-repeat;color:#fff;filter:brightness(1.16)}
body.game #choices>button:active{translate:0 1px;filter:brightness(.95)}
body.game #choices>button:focus-visible{outline:1px solid #def1ff88;outline-offset:4px}
body.game #choices .ctimer{margin-top:0}
/* Dialogue: separate fading skin so silent performance can keep its controls visible. */
body.game #pdlg{left:60px;right:60px;bottom:38px;height:200px;padding:46px 40px 46px;background:none;border:0;border-radius:14px;box-shadow:none;isolation:isolate;opacity:1}
body.game #pdlg::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:var(--whale-dialogue) center/100% 100% no-repeat;opacity:var(--ghost);transition:opacity .4s ease}
body.game #stage.nodlg #pdlg::before{opacity:0}
body.game #pnm{top:-22px;left:28px;min-width:170px;height:40px;padding:0 24px;border-radius:10px;border:1px solid #c0e1fa55;background:linear-gradient(#315679d9,#234565b8);font-size:22px;font-weight:400;letter-spacing:3px;text-shadow:0 1px 3px #153049}
body.game #ptx{color:#f0f8ff;line-height:1.8;letter-spacing:1px;text-shadow:0 1px 3px #102e4d77;overflow-y:auto;overflow-wrap:anywhere;scrollbar-width:thin}
body.game #pctl{right:35px;bottom:12px;gap:5px}
body.game #pctl .btn{width:34px;height:28px;min-width:0;min-height:0;border:0;border-radius:4px;background:#b9dff910;color:#e9f6ff;opacity:.85}
body.game #pctl .btn:hover,body.game #pctl .btn.on{background:#b9dff92c;opacity:1}
body.game #pin{bottom:250px}
@media (pointer:coarse){body.game #pctl{gap:6px}body.game #pctl .btn{width:48px;height:42px;font-size:22px}body.game #pdlg{padding-bottom:62px}}
@media (prefers-reduced-motion:reduce){body.game #title .menu button,body.game #choices>button,body.game #pdlg::before{transition:none}}

</style>
<!-- WHALE_UI_APPROVED_END -->
<!-- WHALE_UI_REPO_ADAPTER_START -->
<style id="whale-ui-repo-adapter">
/* galLingS 仓库适配（2026-10-17）：主页按作者原稿放右侧、每项向左错位 18 px（用户确认，封面不改）；
   仓库主页有 7 项，原稿间距 44 px 会超出画面，故间距收为 26 px，第 5–7 项按同一步长继续错位。
   底栏保留玩家体验打磨确定的文字标签宽度，其余皮肤、透明度与渐变保持原稿。 */
body.game #title .menu{gap:26px}
body.game #title .menu button:nth-child(5){left:-72px}
body.game #title .menu button:nth-child(6){left:-90px}
body.game #title .menu button:nth-child(7){left:-108px}
body.game #pctl{right:22px;bottom:8px;gap:6px}
body.game #pctl .btn{width:auto;min-width:48px;height:30px;padding:0 8px;display:inline-flex;align-items:center;gap:5px}
@media (pointer:coarse){body.game #pctl{gap:8px}body.game #pctl .btn{width:auto;min-width:76px;height:44px}}
/* 台词底板加深（2026-10-22，用户反馈「文本看不清」）：
   原稿底板 opacity 直接取 --ghost，默认 0.35 时几乎全透明；底板图自己的渐变也偏浅
   （#1C3B59 .78 → #638FAC .22），白字压在海面高光上读不出来。
   做法：给 #pdlg 垫一层深海蓝托底（鲸鱼皮肤图仍叠在上面，::before 是负 z-index），
   再给皮肤层加一条不透明度下限，最淡也比原稿实；「对话框不透明度」滑块依然有效。
   无台词演出 #stage.nodlg 会把 #pdlg 背景置透明（index.html 176 行），不会留空底板。 */
body.game #pdlg{background:linear-gradient(180deg,#0d2338f2,#081727fa)}
body.game #pdlg::before{opacity:clamp(.72,calc(var(--ghost) + .37),1)}
/* 竖屏模式（game-polish.css 174 行自带一套浅渐变，这里同步加深并给同一档下限） */
body.game.vport #pdlg::before{background:linear-gradient(180deg,#0f2a44f5,#0a1c2ffa 55%,#0d2338fa);opacity:clamp(.72,calc(var(--ghost) + .37),1)}
body.game #ptx{text-shadow:0 1px 3px #04121fe6,0 0 12px #04121f99}
</style>
<!-- WHALE_UI_REPO_ADAPTER_END -->
</head>
<body>
<div id="app">
  <div id="top">
    <button class="btn" data-tip="new" id="bNew"><i data-ic="file-plus"></i></button>
    <button class="btn" data-tip="open" id="bOpen"><i data-ic="folder-open"></i></button>

    <button class="btn" data-tip="vars" id="bVars"><i data-ic="variable"></i></button>
    <button class="btn" data-tip="chars" id="bChars"><i data-ic="users"></i></button>

  <div id="side">
    <div id="sideHead"><button class="btn" data-tip="side" id="bSide"><i data-ic="panel-left-close"></i></button></div>
    <div class="sec open" id="sbg" data-type="bg">
      <div class="secHead"><span class="ico" data-tip="secBg"><i data-ic="image"></i></span><span class="grow"></span>
        <button class="btn" data-tip="impBg" data-imp="bg"><i data-ic="plus"></i></button><button class="btn fold" data-tip="fold"><i data-ic="chevron-down"></i></button></div>
      <div class="grid" id="gbg"></div>
    </div>
    <div class="sec open" id="sau" data-type="au">
      <div class="secHead"><span class="ico" data-tip="secAu"><i data-ic="music"></i></span><span class="grow"></span>
        <button class="btn" data-tip="impAu" data-imp="au"><i data-ic="plus"></i></button><button class="btn fold" data-tip="fold"><i data-ic="chevron-down"></i></button></div>
      <div class="grid" id="gau"></div>
    </div>
    <div class="sec open" id="sch" data-type="ch">
      <div class="secHead"><span class="ico" data-tip="secCh"><i data-ic="person-standing"></i></span><span class="grow"></span>
        <button class="btn" data-tip="impCh" data-imp="ch"><i data-ic="plus"></i></button><button class="btn fold" data-tip="fold"><i data-ic="chevron-down"></i></button></div>
      <div class="grid" id="gch"></div>
    </div>
  </div>
  <div id="main">
    <div id="stage" data-dlg="ghost">
      <div id="bgEl"></div>
      <div id="empty"><i data-ic="arrow-down-to-line"></i></div>
      <div id="layer"></div>
      <div id="moodFx"></div>
      <div id="guide"></div>
      <div id="sprBar">
        <button class="btn" data-tip="flip" data-op="flip"><i data-ic="flip-horizontal-2"></i></button>
        <button class="btn" data-tip="front" data-op="front"><i data-ic="bring-to-front"></i></button>
        <button class="btn" data-tip="back" data-op="back"><i data-ic="send-to-back"></i></button>
        <button class="btn" data-tip="expr" data-op="expr"><i data-ic="smile"></i></button>
        <button class="btn" data-tip="sprAnim" data-op="anim"><i data-ic="film"></i></button>
        <button class="btn" data-tip="sprLook" data-op="look"><i data-ic="contrast"></i></button>
        <button class="btn" data-tip="del" data-op="del"><i data-ic="trash-2"></i></button>

      <div id="dlg"><input id="nm" spellcheck="false"><textarea id="tx" spellcheck="false"></textarea></div>
      <div id="pdlg"><div id="pnm"></div><div id="ptx"></div>
        <div id="pctl"><button class="btn" data-pc="prev" aria-label="上一句" title="上一句（←）"><i data-ic="arrow-left"></i><span class="pc-label">上一句</span></button><button class="btn" data-pc="log" data-tip="pcLog" aria-label="回看" title="回看"><i data-ic="scroll-text"></i><span class="pc-label">回看</span></button><button class="btn" data-pc="auto" data-tip="pcAuto" aria-label="自动" title="自动"><i data-ic="circle-play"></i><span class="pc-label">自动</span></button><button class="btn" data-pc="skip" data-tip="pcSkip" aria-label="快进" title="快进"><i data-ic="fast-forward"></i><span class="pc-label">快进</span></button><button class="btn" data-pc="save" data-tip="pcSave" aria-label="存档" title="存档"><i data-ic="save"></i><span class="pc-label">存档</span></button><button class="btn" data-pc="load" data-tip="pcLoad" aria-label="读档" title="读档"><i data-ic="folder-open"></i><span class="pc-label">读档</span></button><button class="btn" data-pc="set" data-tip="pcSet" aria-label="设置" title="设置"><i data-ic="settings"></i><span class="pc-label">设置</span></button><button class="btn" data-pc="hide" aria-label="查看完整画面" title="查看完整画面（H），点击画面恢复"><i data-ic="eye"></i><span class="pc-label">画面</span></button><button class="btn" data-pc="exit" data-tip="pcExit" aria-label="标题" title="标题"><i data-ic="log-out"></i><span class="pc-label">标题</span></button></div>
