# galLingS 配置示例（复制为 config.yaml 后修改）。密钥一律走环境变量，不写在这里。
plugins:
  paths:
    - plugins/builtin
    - ~/.gallings/plugins          # 玩家 / 第三方插件
  select:                          # 单例 kind：列表 = 主用 + 降级备选（按顺序）
    llm: [gallings.llm.openai-compat, gallings.llm.scripted]
    # memory: gallings.memory.lingshu
  tools: [gallings.tool.proposals]
  guards: [gallings.guard.injection]
  importers: []
  config:
    gallings.llm.openai-compat:
      base_url: https://api.deepseek.com
      model: deepseek-chat
    gallings.llm.scripted:
      responses:
        - text: "……哼，你还没走啊。"
    # gallings.memory.lingshu:
    #   dsh_memory_path: /path/to/dsh-memory
