[project]
name = "gallings"
version = "0.1.0"
description = "galLingS：角色卡驱动、模型以 agent 身份接入的 Galgame 引擎"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6",
  "jsonschema>=4.20",
  "packaging>=23",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
