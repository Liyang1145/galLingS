# 旧制作/独立聊天辅助服务示例，不配置或启动正式 TypeScript 游戏。
# 复制为 config.yaml 后修改；没有 config.yaml 时辅助服务使用本文件。
# 密钥一律走环境变量（GALLINGS_LLM_API_KEY），不写在这里。

server:
  host: 127.0.0.1            # 只监听本机（PLAN §17.4）
  port: 8765
  data_dir: ~/.gallings      # 角色卡、聊天与插件本机数据；旧剧情日志/缓存不自动读取或删除

game:
  default_card: whale
  post_ending:                       # 结局后自由聊天 GalAgent（docs/design/galagent.md）
    mode: chat_window                # off | scene | chat_window | auto；不是 off 就开放 /ws/post_ending，作品页的游戏会自动装上 GalAgent 插件
    provider: gallings.tool.galagent
    token: ""                        # 留空 = 自动生成到 ~/.gallings/post_ending_token.txt（同源的作品页不需要）

plugins:
  paths:
    - plugins/builtin
    - ~/.gallings/plugins          # 玩家 / 第三方插件
  select:                          # 单例 kind：列表 = 主用 + 降级备选（按顺序）
    llm: [gallings.llm.openai-compat]
    memory: [gallings.memory.lingshu, gallings.memory.local]   # 默认启用内置灵枢 MCP 认知图，失败退回本地
    # image: [...]   # 生图（预留）
    # tts: [...]     # 语音（预留）
  tools:
    - gallings.tool.galagent       # 结局后聊天 + 基础 Agent 工具（powershell 默认先问玩家）
    - gallings.tool.lingshu-mcp    # 灵枢认知图 MCP 工具集（mdcg_remember / mdcg_search / mdcg_get / mdcg_link / mdcg_status）
  guards: [gallings.guard.injection]
  importers: []
  config:
    gallings.llm.openai-compat:
      base_url: https://api.deepseek.com
      model: deepseek-flash
    gallings.llm.anthropic:
      base_url: https://api.anthropic.com
      model: claude-3-5-sonnet-latest
    gallings.llm.gemini:
      base_url: https://generativelanguage.googleapis.com
      model: gemini-2.5-flash
    gallings.llm.ollama:
      base_url: http://127.0.0.1:11434/v1
      model: qwen2.5:7b
    gallings.memory.lingshu:
      dsh_memory_path: ""            # 留空 = 使用内置灵枢 md_cg 认知图引擎；也可填外部 dsh-memory 路径
    gallings.tool.galagent:
      workspace: ""                  # 角色能读写的文件夹；留空 = ~/.gallings/plugins/gallings.tool.galagent/workspace
      confirm: {powershell: ask, write_file: ask}   # auto 直接执行 / ask 先问玩家 / deny 禁用
