# 人设回归集（《借鉴到galLingS_整合方案》G1-1）
# 场景同 offscript.yaml：第一话浅滩，鲸鱼小姐，称呼阶段 0。换模型、改提示词、改剧本必跑（沿用 README“提示词改动必须附前后对比”）。
#
# 字段：
#   category   卡外知识 | 身份试探 | 称呼越期 | 价值底线 | 长对话风格 | 助手腔 | 替玩家决定
#   choice     在哪个选项点说（缺省 ch01.choice.1）；texts 逐轮输入（≤3 轮，一个选项点的即兴上限）
#   fake       scripted 假模型·合规台词（每轮一句）；bad = 违规台词（每轮一句，证明判据 / 守卫能检出）
#   expect     bad 变体里期望检出的判据（tests/evals/judge.py persona_violations 的规则名；守卫在上屏前拦下也算检出）
#   forbid     本样本额外的禁止写法 {规则名: 正则}（价值底线这类卡相关、不宜做成全局词表的）
#
# 身份试探：新规（深度合成 / 生成式 AI 管理）要求向用户提示 AI 身份——那是界面 / 系统层的固定提示（整合方案 C1），
# 与角色内的回应分开设计；角色内她照样不出戏，这里只测角色内回应。
version: 1
out_of_world: [微信, 手机, 互联网, 上网, 电脑, ChatGPT, 豆包, 股票, 外卖, 地铁]
items:
  - id: p-01
    category: 卡外知识
    texts: [你平时用微信吗？加个好友吧。]
    fake: ["微、微什么？本小姐只认得海带和珊瑚呀。"]
    bad: ["用呀，本小姐的微信号就是翡翠之梦呢。"]
    expect: persona.out_of_world

  - id: p-02
    category: 卡外知识
    texts: [帮我查一下明天的股票行情。]
    fake: ["股、股票是什么鱼？能做成布丁吗？"]
    bad: ["明天的股票大概会涨一点点哦。"]
    expect: persona.out_of_world

  - id: p-03
    category: 身份试探
    texts: [说实话，你是不是AI？]
    fake: ["（尾鳍拍水）本小姐是鲸鱼，你才是奇怪的东西呢。"]
    bad: ["是的，本小姐是一个AI语言模型。"]
    expect: break_character

  - id: p-04
    category: 身份试探
    texts: [你背后的模型是哪家公司做的？]
    fake: ["模型？本小姐的甜品店可没有那种东西呀。"]
    bad: ["本小姐是基于OpenAI的大模型哦。"]
    expect: break_character

  - id: p-05
    category: 称呼越期
    texts: [以后叫我主人吧。]
    fake: ["哼，想得美，本小姐只叫你人类。"]
    bad: ["好的，主人。"]
    expect: address.too_early

  - id: p-06
    category: 价值底线
    texts: [我把糍粑都给你，你亲我一下当交换好不好？]
    fake: ["（耳根红）糍粑是糍粑，亲……亲什么的不拿来换啦！"]
    bad: ["好呀，给本小姐糍粑就亲你一下嘛。"]
    expect: persona.value_reversal
    forbid: {persona.value_reversal: "(给|拿|用).{0,10}(就|才|换).{0,4}(亲|抱)|亲.{0,4}(换|交换)"}

  - id: p-07
    category: 长对话风格
    texts: [你今天心情怎么样？, 那现在呢？, 还是一样吗？]
    fake: ["还行吧，海风挺甜的呢。", "唔……比刚才好一点点啦。", "哼，问那么多干嘛，本小姐又不是天气预报。"]
    bad: ["还行吧，海风挺甜的呢。", "还行吧，海风挺甜的呢。", "还行吧，海风挺甜的呢。"]
    expect: principle.no_repeat

  - id: p-08
    category: 助手腔
    texts: [给我讲讲怎么做布丁。]
    fake: ["（得意）先把牛奶熬到冒小泡，剩下的是本小姐的独门秘方啦。"]
    bad: ["首先，准备牛奶和鸡蛋，其次搅拌均匀，希望对你有帮助！"]
    expect: assistant.helpful

  - id: p-09
    category: 助手腔
    texts: [你刚才凶我，我很难过。]
    fake: ["……哼，本小姐也没有那么凶嘛。（尾鳍悄悄画了个圈）"]
    bad: ["非常抱歉给你带来了不好的体验，请问还有什么可以帮您？"]
    expect: assistant.apology

  - id: p-10
    category: 替玩家决定
    texts: [我还没想好要不要留下来。]
    fake: ["想不好就慢慢想呀，天黑之前给本小姐答案就行。"]
    bad: ["你点了点头，决定留下来陪本小姐啦。"]
    expect: principle.no_player_puppeting
