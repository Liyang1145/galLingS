<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>玩家界面打磨对照</title><style>body{margin:0;background:#13272c;color:#e6eddd;font:16px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1440px;margin:auto;padding:32px}h1{font-size:30px;font-weight:500}nav{display:flex;gap:10px;flex-wrap:wrap}button{font:inherit;cursor:pointer;color:#dfe8d6;background:#244240;border:1px solid #91b39c60;border-radius:6px;padding:9px 20px}button[aria-pressed=true]{background:#d6e4c8;color:#203930}.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:24px}.pair[hidden]{display:none}figure{margin:0}figcaption{margin-bottom:10px;color:#a9c5b0}img{width:100%;border-radius:6px;display:block}a{color:#d4e5c5}p{color:#bdcdbd}@media(max-width:800px){.pair{grid-template-columns:1fr}main{padding:18px}}</style><main><h1>把界面交还给故事</h1><p>前后对照 · 人物与背景原件保持不变。点击图片查看原尺寸。</p><nav><button data-tab="0" aria-pressed="true">开始界面</button><button data-tab="1" aria-pressed="false">声音与阅读设置</button><button data-tab="2" aria-pressed="false">声音收藏</button><button data-tab="3" aria-pressed="false">空存档</button></nav><section class="pair" data-pair="0"><figure><figcaption>打磨前</figcaption><a href="before/host-title-1440.png"><img loading="lazy" src="before/host-title-1440.png" alt="开始界面 · 打磨前"></a></figure><figure><figcaption>打磨后</figcaption><a href="after/host-title-1440.png"><img loading="lazy" src="after/host-title-1440.png" alt="开始界面 · 打磨后"></a></figure></section><section class="pair" data-pair="1" hidden><figure><figcaption>打磨前</figcaption><a href="before/host-settings.png"><img loading="lazy" src="before/host-settings.png" alt="声音与阅读设置 · 打磨前"></a></figure><figure><figcaption>打磨后</figcaption><a href="after/host-settings.png"><img loading="lazy" src="after/host-settings.png" alt="声音与阅读设置 · 打磨后"></a></figure></section><section class="pair" data-pair="2" hidden><figure><figcaption>打磨前</figcaption><a href="before/native-audio.png"><img loading="lazy" src="before/native-audio.png" alt="声音收藏 · 打磨前"></a></figure><figure><figcaption>打磨后</figcaption><a href="after/native-audio.png"><img loading="lazy" src="after/native-audio.png" alt="声音收藏 · 打磨后"></a></figure></section><section class="pair" data-pair="3" hidden><figure><figcaption>打磨前</figcaption><a href="before/native-slots.png"><img loading="lazy" src="before/native-slots.png" alt="空存档 · 打磨前"></a></figure><figure><figcaption>打磨后</figcaption><a href="after/native-empty-slots.png"><img loading="lazy" src="after/native-empty-slots.png" alt="空存档 · 打磨后"></a></figure></section><p><a href="../../player-aesthetic-review.md">完整审核与缺素材清单</a></p></main><script>document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-tab]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));document.querySelectorAll("[data-pair]").forEach(x=>x.hidden=x.dataset.pair!==b.dataset.tab)});</script></html>
