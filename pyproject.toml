[project]
name = "gallings"
version = "0.1.0"
description = "galLingS：角色卡驱动、模型以 agent 身份接入的 Galgame 引擎"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6",
  "jsonschema>=4.20",
  "packaging>=23",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "websockets>=12",
  # 确定性核心（Rust，core/）：Windows 用 CI 产出的轮子，见 docs/demo.md
  # "galcore==0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
art = ["Pillow>=10"]  # Optional: rebuild the art index/thumbnails and portable review HTML.

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
