schema_version: 1
id: gallings.llm.anthropic
name: Anthropic Claude 模型网关
version: 0.1.0
kind: llm
api: 1
description: 走 Anthropic /v1/messages 原生流式接口（Claude 系列模型），支持思考块、工具调用与用量统计，归一为五种内部事件（PLAN §12）。
requires:
  gallings: ">=0.1,<0.2"
  python: ">=3.11"
runtime:
  type: python
  entry: plugin.py:AnthropicLLM
capabilities: [stream, tools, usage]
config_schema:
  type: object
  additionalProperties: false
  required: [base_url, model]
  properties:
    base_url: {type: string, default: "https://api.anthropic.com"}
    model: {type: string, default: "claude-3-5-sonnet-latest"}
    temperature: {type: number, minimum: 0, maximum: 1, default: 0.8}
    max_tokens: {type: integer, minimum: 64, maximum: 65536, default: 2048}
    timeout_s: {type: number, minimum: 1, default: 60}
    connect_timeout_s: {type: number, minimum: 1, default: 10}
secrets:
  - name: api_key
    env: GALLINGS_LLM_API_KEY
    required: true
    description: Anthropic API key；只从环境变量读
permissions:
  network: [api.anthropic.com]
determinism: recorded
