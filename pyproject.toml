[project]
name = "gallings"
version = "0.1.0"
description = "海风与布丁保留的旧制作、角色卡与独立聊天辅助服务"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6",
  "jsonschema>=4.20",
  "packaging>=23",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
art = ["Pillow>=10"]  # Optional: rebuild the art index/thumbnails and portable review HTML.

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
