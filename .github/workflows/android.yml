# 安卓试玩包：把作品文件夹（content/imports/vnstudio/海风与布丁）装进 WebView 外壳 → APK。
# 产物：Actions → 本次运行 → Artifacts → haifeng-pudding-android；同时更新预发布 android-playtest 的附件。
name: android
on:
  push:
    branches: [fix/character-performance]
    paths: ["mobile/**", "content/imports/vnstudio/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            mobile
            content/imports/vnstudio
          sparse-checkout-cone-mode: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: 素材
        run: |
          pip install pillow
          python mobile/prepare_assets.py "content/imports/vnstudio/海风与布丁" mobile/android
      - name: 打包
        working-directory: mobile/android
        env:
          APK_VERSION_CODE: ${{ github.run_number }}
          APK_VERSION_NAME: playtest-${{ github.run_number }}-${{ github.sha }}
        run: gradle --no-daemon assembleRelease
      - name: 改名
        run: |
          mkdir -p out
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "out/haifeng-pudding-playtest.apk"
          ls -l out
      - uses: actions/upload-artifact@v5
        with:
          name: haifeng-pudding-android
          path: out/
      - name: 预发布附件
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-playtest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create android-playtest -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
              --title "海风与布丁 安卓试玩包" --notes "自动构建：作品文件夹 + WebView 外壳。横竖屏在游戏设置“屏幕方向”里切换。调试签名，仅供试玩。"
          gh release upload android-playtest out/haifeng-pudding-playtest.apk -R "$GITHUB_REPOSITORY" --clobber
          gh release edit android-playtest -R "$GITHUB_REPOSITORY" --notes "自动构建 ${GITHUB_SHA:0:7}（第 ${GITHUB_RUN_NUMBER} 次）：作品文件夹 + WebView 外壳。横竖屏在游戏设置“屏幕方向”里切换。调试签名，仅供试玩。"
