[package]
name = "gallings-desktop"
version = "0.1.0"
edition = "2021"
description = "《海风与布丁》TypeScript 游戏本体的 Windows 宿主"
license = "Apache-2.0"
publish = false

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
