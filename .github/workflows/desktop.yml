# 桌面程序：离线包（tools/build_desktop_dist.py）+ Tauri 外壳 → Windows 安装包和免安装 exe。
# 产物在 Actions → 本次运行 → Artifacts → gallings-desktop-windows。
name: desktop
on:
  push:
    branches: [main, tanpowasd/dev]
    paths: ["core/**", "web/**", "desktop/**", "content/imports/**", "content/cards/**", "compiler/**", "tools/build_desktop_dist.py", ".github/workflows/desktop.yml"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core
            desktop/src-tauri
      - name: 依赖
        run: python -m pip install -r requirements.txt
      - name: 引擎 → wasm
        working-directory: core
        run: cargo build --release --target wasm32-unknown-unknown
      - name: 离线包
        run: python tools/build_desktop_dist.py
      - name: Tauri 打包
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 build
      - name: 免安装版（exe + game 文件夹）
        shell: bash
        run: |
          mkdir -p out/portable
          cp desktop/src-tauri/target/release/gallings-desktop.exe "out/portable/海风与布丁.exe"
          cp -r dist/desktop out/portable/game
          cp desktop/src-tauri/target/release/bundle/nsis/*.exe out/
      - uses: actions/upload-artifact@v5
        with:
          name: gallings-desktop-windows
          path: out/
